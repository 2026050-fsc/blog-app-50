<head th:replace="~{fragments/layout :: head('ブログ一覧')}"></head>
<!-- ヘッダーのフラグメント化 -->

<body>

    <header class="site-header">
        <a class="site-name">
            <h1>Blog</h1>
        </a>
        <nav class="site-nav">
            <ul>
                <li><a href="/blogs">ホーム</a></li>
                <li><a href="/blogs/new">新規投稿</a></li>
                <li><a href="/blogs/profile">投稿者</a></li>
            </ul>
        </nav>
    </header>
    <!-- 共通ナビゲーション -->


    <h1>ブログ一覧</h1>
    <p th:if="${#lists.isEmpty(blogs)}">ブログがありません</p>
    <!-- th:ifを付けたタグは ${...} の中身が真の時だけ出力され、偽のときは出力されない
    リストが空かどうかは、Thymeleafの組み込みオブジェクト #lists.isEmpty(リスト名) で判定
    (リスト名)のリスト名はリストを作成しているファイル(TasksController.java)を参照する -->

    <!-- <ul>
        <li th:each="blog :${blogs}"> -->
    <!-- th:each 同じ形のリストを要素の数だけ繰り返す -->
    <!-- th:eachは大枠のulではなく、項目(データ)を持つliに付ける -->
    <!-- <span th:text="${blog.title}">仮表示占いタイトル</span>
            <span th:text="${blog.notes}">仮表示占い本文</span> -->
    <!-- th:text タグの中身に値を埋め込む ${...} の値で置き換え -->
    <!-- <a href="/blogs/detail">続きを読む</a>
        </li>
    </ul> -->
    <!-- 上記ulタグ内を下記div表示に変更 -->
    <div th:each="blog :${blogs}" class="blog-container">
        <div class="width-display">
            <div class="child">
                <div th:text="${blog.title}">仮表示占いタイトル</div>
                <!-- <img src="/images/blood.png" alt="" width="200px"> -->
                <img th:src="@{'/images/' + ${blog.imgs}}" alt="ブログ画像" width="70px"><br>
                <a th:href="@{/blogs/{id}(id=${blog.id})}">詳細を見る</a>
            </div>
        </div>
    </div>
    <a href="/blogs/new">新規投稿</a>
</body>

</html>
